function controls(el,M,camPos,enabled){

/* ===== UI helpers ===== */
const bar=()=>`<div class="prog"><span>${String(si).padStart(2,'0')} / ${String(steps.length-1).padStart(2,'0')}</span><i style="--p:${Math.round(si/(steps.length-1)*100)}%"></i></div>`;
let cleanup=null;
const back=()=>{if(si>0){si--;steps[si]()}};
const screen=h=>{if(cleanup){cleanup();cleanup=null}

const skipBtn=()=>DEV?'<button type="button" class="alt" id="sk">Skip</button>':'';
const next=()=>{si++;steps[si]()};
const mc=(k,q,o)=>`<fieldset data-r data-n="${k}"><legend>${q}</legend>${o.map(v=>`<label class="o"><input type="radio" name="${k}" value="${v}"> ${v}</label>`).join('')}</fieldset>`;
const lk=(k,q)=>`<fieldset data-r data-n="${k}"><legend>${q}</legend><div class="lk">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${k}" value="${n}">${n}</label>`).join('')}</div><div class="ends"><span>Strongly disagree</span><span>Strongly agree</span></div></fieldset>`;

/* ===== Steps ===== */
function consent(){screen(`<h1>WebAR PC Hardware Learning</h1>
<p>You will study the inside of a desktop computer case in two ways (a 2D picture and an AR model), answer short quizzes, and rate each experience.</p>
<p><b>Your privacy:</b> participation is voluntary and you can stop at any time. We do not collect your name, matric number, email or IP address. The camera is used only on your phone to show the AR model; no photos or video are recorded or sent. This is not graded.</p>
<form id="f" style="margin-top:30px"><label class="o cb"><input type="checkbox" id="ok"> I am 18 or older and agree to take part.</label><p class="err" id="e"></p><div class="acts"><button>Start</button>${skipBtn()}</div></form>`);

 $('#f').onsubmit=e=>{e.preventDefault();if(!$('#ok').checked){$('#e').textContent='Please tick the box to continue.';return}next()}}

 mc('device','Which phone are you using?',['iPhone','Android','Other'])+mc('prior_ar','How often have you used AR before?',['Never','1 to 3 times','Often']),a=>{D.about=a;
 const FO=DEV&&new URLSearchParams(location.search).get('order');
 if(!D.order){D.order=FO==='2d'?['2d','ar']:FO==='ar'?['ar','2d']:Math.random()<.5?['2d','ar']:['ar','2d'];D.forms=Math.random()<.5?['A','B']:['B','A']}

 si=1;next()})}
function stage(m,i){D.stages[m]=D.stages[m]||{pos:i+1};const t0=Date.now();
 const fin=()=>{D.stages[m].seconds=Math.round((Date.now()-t0)/1000);next()};
 const skip=()=>{D.stages[m].skipped=true;fin()};
 if(m==='2d'){screen(`<h2>Study the PC case</h2><p class="in">Look carefully at both pictures for at least ${CONFIG.MIN_SECONDS} seconds. You will be quizzed from memory afterwards.</p>
<figure class="plate"><img class="v" alt="Side view of the inside of a PC case, side panel removed, with labelled components" src="${snapshot('side')}"><figcaption>Figure 1. Side view, side panel removed.</figcaption></figure>
<figure class="plate"><img class="v" alt="Angled view of the inside of a PC case from the front, with labelled components" src="${snapshot('angle')}"><figcaption>Figure 2. Angled view from the front.</figcaption></figure>
<div class="acts"><button id="go"></button>${skipBtn()}</div>
<h3 class="notes">Component descriptions<em>Tap a part to read about it</em></h3>${partsHTML()}`);

  $('#go').onclick=()=>startAR(D.stages[m],fin);if(DEV)$('#sk').onclick=skip}}
